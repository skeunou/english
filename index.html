<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English — Mon Univers</title>
<style>
  :root{
    --ink:#1a1c2e; --paper:#f4f1ea; --line:#dcd6ca;
    --sport:#e85d3d; --english:#2b7a78; --mtc:#9a8c98;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    font-family:system-ui,-apple-system,sans-serif; background:var(--paper); color:var(--ink);
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:32px 18px;
    background-image:radial-gradient(circle at 15% 10%, rgba(232,93,61,.08), transparent 40%),
                     radial-gradient(circle at 85% 90%, rgba(43,122,120,.08), transparent 42%);
  }
  .back{align-self:flex-start;margin-bottom:8px;font-size:.85rem;color:var(--ink);opacity:.6;text-decoration:none}
  .back:hover{opacity:1}
  header{text-align:center; margin:24px 0 36px}
  header h1{font-family:Georgia,serif; font-size:1.9rem; letter-spacing:.5px}
  header p{font-size:.8rem; opacity:.6; margin-top:8px; letter-spacing:2px; text-transform:uppercase}
  .grid{width:100%; max-width:440px; display:flex; flex-direction:column; gap:16px}
  .card{
    display:block; text-decoration:none; color:inherit; position:relative;
    background:#fff; border:1.5px solid var(--line); border-radius:20px;
    padding:26px 22px; transition:transform .12s, box-shadow .2s;
    box-shadow:0 6px 18px rgba(26,28,46,.06); overflow:hidden;
  }
  .card:active{transform:scale(.98)}
  .card .accent{position:absolute; left:0; top:0; bottom:0; width:6px}
  .card.sport .accent{background:var(--sport)}
  .card.english .accent{background:var(--english)}
  .card.mtc .accent{background:var(--mtc)}
  .card .emoji{font-size:2.2rem; margin-bottom:10px; display:block}
  .card h2{font-family:Georgia,serif; font-size:1.4rem; margin-bottom:4px}
  .card .desc{font-size:.85rem; opacity:.65; line-height:1.5}
  .card .arrow{position:absolute; right:22px; top:50%; transform:translateY(-50%); font-size:1.3rem; opacity:.4}
  .card.disabled{opacity:.55; cursor:not-allowed; box-shadow:none}
  .card.disabled .arrow{display:none}
  .badge{
    position:absolute; right:20px; top:20px; font-size:.62rem; font-weight:700;
    text-transform:uppercase; letter-spacing:1px; background:var(--mtc); color:#fff;
    padding:4px 9px; border-radius:20px;
  }
  footer{margin-top:auto; padding-top:32px; font-size:.66rem; opacity:.4; text-align:center}
</style>
</head>
<body>
  <a class="back" href="https://skeunou.github.io/">← Mes Univers</a>

  <header>
    <h1>English</h1>
    <p>Mon apprentissage</p>
  </header>

  <div class="grid">

    <a class="card sport" href="https://skeunou.github.io/lv-tools/">
      <span class="accent"></span>
      <span class="emoji">🏋️</span>
      <h2>LV TOOL</h2>
      <div class="desc">Mes outils de sport et d'entraînement</div>
      <span class="arrow">→</span>
    </a>

    <a class="card english" href="https://skeunou.github.io/english/">
      <span class="accent"></span>
      <span class="emoji">🎙️</span>
      <h2>English</h2>
      <div class="desc">Mon apprentissage de l'anglais — coach vocal & vocabulaire</div>
      <span class="arrow">→</span>
    </a>

    <div class="card mtc disabled">
      <span class="accent"></span>
      <span class="badge">Bientôt</span>
      <span class="emoji">🌿</span>
      <h2>MTC</h2>
      <div class="desc">Médecine Traditionnelle Chinoise — cours à venir</div>
    </div>

  </div>

  <footer>Portail personnel</footer>
</body>
</html>
