<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My English Vocabulary Glossary</title>
<style>
  :root {
    --bg: #fafaf8;
    --bg2: #f0efe9;
    --bg3: #ffffff;
    --text: #1a1a18;
    --text2: #5a5a55;
    --text3: #9a9a93;
    --border: rgba(0,0,0,0.1);
    --border2: rgba(0,0,0,0.18);
    --accent: #3c34b9;
    --accent-bg: #eeedfe;
    --accent-text: #26215c;
    --green: #0f6e56;
    --green-bg: #e1f5ee;
    --green-text: #04342c;
    --amber: #854f0b;
    --amber-bg: #faeeda;
    --amber-text: #412402;
    --coral: #993c1d;
    --coral-bg: #faece7;
    --coral-text: #4a1b0c;
    --pink: #993556;
    --pink-bg: #fbeaf0;
    --pink-text: #4b1528;
    --teal: #0f6e56;
    --teal-bg: #e1f5ee;
    --blue: #185fa5;
    --blue-bg: #e6f1fb;
    --blue-text: #042c53;
    --gray: #5f5e5a;
    --gray-bg: #f1efe8;
    --shadow: 0 1px 3px rgba(0,0,0,0.07);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1a;
      --bg2: #252523;
      --bg3: #2c2c2a;
      --text: #e8e8e2;
      --text2: #a8a8a0;
      --text3: #686860;
      --border: rgba(255,255,255,0.1);
      --border2: rgba(255,255,255,0.18);
      --accent-bg: #3c3489;
      --accent-text: #cecbf6;
      --green-bg: #085041;
      --green-text: #9fe1cb;
      --amber-bg: #633806;
      --amber-text: #fac775;
      --coral-bg: #712b13;
      --coral-text: #f5c4b3;
      --pink-bg: #72243e;
      --pink-text: #f4c0d1;
      --blue-bg: #0c447c;
      --blue-text: #b5d4f4;
      --gray-bg: #444441;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.6;
  }

  header {
    background: var(--bg3);
    border-bottom: 0.5px solid var(--border2);
    padding: 1.2rem 2rem;
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }

  header h1 {
    font-size: 18px;
    font-weight: 600;
    color: var(--text);
    flex: 1;
    min-width: 200px;
  }

  header h1 span {
    font-size: 13px;
    font-weight: 400;
    color: var(--text2);
    margin-left: 8px;
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .search-box {
    position: relative;
  }

  .search-box input {
    padding: 7px 12px 7px 34px;
    border: 0.5px solid var(--border2);
    border-radius: 8px;
    background: var(--bg2);
    color: var(--text);
    font-size: 14px;
    width: 200px;
    outline: none;
    transition: border-color 0.15s;
  }

  .search-box input:focus { border-color: var(--accent); }

  .search-box::before {
    content: '🔍';
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 13px;
    pointer-events: none;
  }

  .btn {
    padding: 7px 14px;
    border: 0.5px solid var(--border2);
    border-radius: 8px;
    background: var(--bg2);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    font-weight: 500;
  }

  .btn:hover { background: var(--bg3); border-color: var(--accent); }

  .btn.active {
    background: var(--accent-bg);
    border-color: var(--accent);
    color: var(--accent-text);
  }

  .btn-reveal {
    background: var(--green-bg);
    border-color: var(--green);
    color: var(--green-text);
    font-weight: 600;
  }

  .btn-reveal:hover { opacity: 0.85; }

  select {
    padding: 7px 12px;
    border: 0.5px solid var(--border2);
    border-radius: 8px;
    background: var(--bg2);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    outline: none;
  }

  .hide-mode-bar {
    display: none;
    background: var(--amber-bg);
    border-bottom: 0.5px solid var(--amber);
    padding: 8px 2rem;
    font-size: 13px;
    color: var(--amber-text);
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .hide-mode-bar.visible { display: flex; }

  .hide-mode-bar strong { font-weight: 600; }

  .stats-bar {
    padding: 10px 2rem;
    background: var(--bg2);
    border-bottom: 0.5px solid var(--border);
    font-size: 13px;
    color: var(--text2);
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }

  .stats-bar b { color: var(--text); font-weight: 600; }

  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 1.5rem 1.5rem 4rem;
  }

  .theme-nav {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 1.5rem;
  }

  .theme-pill {
    padding: 5px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border: 0.5px solid var(--border2);
    background: var(--bg3);
    color: var(--text2);
    transition: all 0.15s;
    text-decoration: none;
  }

  .theme-pill:hover { border-color: var(--accent); color: var(--accent-text); background: var(--accent-bg); }

  .theme-section {
    margin-bottom: 2.5rem;
  }

  .theme-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 1rem;
    padding-bottom: 8px;
    border-bottom: 1.5px solid var(--border2);
  }

  .theme-icon {
    font-size: 22px;
  }

  .theme-title {
    font-size: 17px;
    font-weight: 600;
    color: var(--text);
  }

  .theme-count {
    font-size: 12px;
    background: var(--bg2);
    color: var(--text2);
    padding: 2px 8px;
    border-radius: 12px;
    border: 0.5px solid var(--border);
  }

  .subcat {
    margin-bottom: 1.2rem;
  }

  .subcat-title {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text3);
    margin-bottom: 6px;
    padding-left: 2px;
  }

  .vocab-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap: 6px;
  }

  .vocab-card {
    background: var(--bg3);
    border: 0.5px solid var(--border);
    border-radius: 8px;
    padding: 9px 12px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
    transition: border-color 0.15s;
    cursor: default;
  }

  .vocab-card:hover { border-color: var(--border2); }

  .vocab-card .fr {
    font-size: 14px;
    color: var(--text2);
    flex: 1;
    min-width: 0;
  }

  .vocab-card .en {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    text-align: right;
    flex: 1;
    transition: all 0.2s;
    cursor: pointer;
  }

  .vocab-card .en.hidden {
    background: var(--bg2);
    border-radius: 4px;
    color: transparent;
    user-select: none;
    border: 0.5px dashed var(--border2);
    padding: 1px 8px;
    font-size: 13px;
  }

  .vocab-card .en.hidden:hover {
    background: var(--amber-bg);
    color: var(--amber-text);
    border-color: var(--amber);
  }

  .course-tag {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 4px;
    background: var(--accent-bg);
    color: var(--accent-text);
    white-space: nowrap;
    font-weight: 500;
    align-self: center;
  }

  .no-results {
    text-align: center;
    color: var(--text3);
    padding: 3rem;
    font-size: 15px;
  }

  @media (max-width: 600px) {
    header { padding: 1rem; }
    main { padding: 1rem 1rem 3rem; }
    .vocab-grid { grid-template-columns: 1fr; }
    header h1 { font-size: 16px; }
  }
</style>
</head>

let hideMode = false;

function toggleHideMode() {
  hideMode = !hideMode;
  const btn = document.getElementById('btn-hide');
  const bar = document.getElementById('hide-bar');
  const btnReveal = document.getElementById('btn-reveal-all');

  if (hideMode) {
    btn.textContent = '👁 Show English';
    btn.classList.add('active');
    bar.classList.add('visible');
    btnReveal.style.display = 'inline-block';
    document.querySelectorAll('.en').forEach(el => {
      el.classList.add('hidden');
      el.title = 'Click to reveal';
    });
  } else {
    btn.textContent = '👁 Hide English';
    btn.classList.remove('active');
    bar.classList.remove('visible');
    btnReveal.style.display = 'none';
    document.querySelectorAll('.en').forEach(el => {
      el.classList.remove('hidden');
      el.title = '';
    });
  }
}

function revealAll() {
  document.querySelectorAll('.en.hidden').forEach(el => {
    el.classList.remove('hidden');
    el.title = '';
  });
}

function toggleWord(el) {
  if (el.classList.contains('hidden')) {
    el.classList.remove('hidden');
    el.title = '';
  }
}

function filterVocab() {
  const search = document.getElementById('search').value.toLowerCase();
  const course = document.getElementById('filter-course').value;
  let count = 0;

  document.querySelectorAll('.vocab-card').forEach(card => {
    const en = card.dataset.en;
    const fr = card.dataset.fr;
    const c = card.dataset.course;
    const matchSearch = !search || en.includes(search) || fr.includes(search);
    const matchCourse = !course || c === course;
    const visible = matchSearch && matchCourse;
    card.style.display = visible ? '' : 'none';
    if (visible) count++;
  });

  document.getElementById('shown-count').textContent = count;

  document.querySelectorAll('.subcat').forEach(s => {
    const any = Array.from(s.querySelectorAll('.vocab-card')).some(c => c.style.display !== 'none');
    s.style.display = any ? '' : 'none';
  });

  document.querySelectorAll('.theme-section').forEach(s => {
    const any = Array.from(s.querySelectorAll('.vocab-card')).some(c => c.style.display !== 'none');
    s.style.display = any ? '' : 'none';
  });

  const hasResults = count > 0;
  let noRes = document.getElementById('no-results');
  if (!hasResults && !noRes) {
    noRes = document.createElement('div');
    noRes.id = 'no-results';
    noRes.className = 'no-results';
    noRes.textContent = 'No words found. Try a different search.';
    document.getElementById('glossary').appendChild(noRes);
  } else if (hasResults && noRes) {
    noRes.remove();
  }
}

function buildGlossary() {
  const nav = document.getElementById('theme-nav');
  const glossary = document.getElementById('glossary');

  let totalWords = VOCAB.length;
  document.getElementById('total-count').textContent = `— ${totalWords} words`;
  document.getElementById('shown-count').textContent = totalWords;

  Object.entries(THEMES).forEach(([themeKey, themeInfo]) => {
    const themeWords = VOCAB.filter(w => w.theme === themeKey);
    if (themeWords.length === 0) return;

    const pill = document.createElement('a');
    pill.className = 'theme-pill';
    pill.href = `#theme-${themeKey}`;
    pill.textContent = `${themeInfo.icon} ${themeInfo.label}`;
    nav.appendChild(pill);

    const section = document.createElement('div');
    section.className = 'theme-section';
    section.id = `theme-${themeKey}`;

    const header = document.createElement('div');
    header.className = 'theme-header';
    header.innerHTML = `
      <span class="theme-icon">${themeInfo.icon}</span>
      <span class="theme-title">${themeInfo.label}</span>
      <span class="theme-count">${themeWords.length} words</span>
    `;
    section.appendChild(header);

    const subcats = [...new Set(themeWords.map(w => w.subcat))];

    subcats.forEach(subcatName => {
      const words = themeWords.filter(w => w.subcat === subcatName);
      const subcatDiv = document.createElement('div');
      subcatDiv.className = 'subcat';

      subcatDiv.innerHTML = `<div class="subcat-title">${subcatName}</div>`;

      const grid = document.createElement('div');
      grid.className = 'vocab-grid';

      words.forEach(word => {
        const card = document.createElement('div');
        card.className = 'vocab-card';
        card.dataset.en = word.en.toLowerCase();
        card.dataset.fr = word.fr.toLowerCase();
        card.dataset.course = word.course;
        card.innerHTML = `
          <span class="fr">${word.fr}</span>
          <span class="en" onclick="toggleWord(this)" title="">${word.en}</span>
          <span class="course-tag">${word.course}</span>
        `;
        grid.appendChild(card);
      });

      subcatDiv.appendChild(grid);
      section.appendChild(subcatDiv);
    });

    glossary.appendChild(section);
  });
}

buildGlossary();
